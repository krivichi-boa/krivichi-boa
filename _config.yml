title: "Белорусское общество аквариумистов"
description: "Заметки, дневники запуска и полезный опыт любителей подводного мира в Беларуси."
url: "https://github.io"
locale: "ru-RU"

# Тема оформления и стиль
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "mint"

# Настройки автора блога (Нейтральные, без фото)
author:
  name: "БОА"
  avatar:
  bio: "Блог об аквариумистике: фото аквариумов, обзоры растений и дневники ухода."
  location: "Кривичи"
  links:
    - label: "Telegram-канал"
      icon: "fab fa-fw fa-telegram"
      url: "https://t.me"
    - label: "Threads"
      icon: "fas fa-fw fa-at"
      url: "https://threads.net"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram-square"
      url: "https://instagram.com"

# Подключаемые системные плагины
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

# Исключаем системный мусор из сборки
exclude:
  - "node_modules"
  - "Gemfile"
  - "Gemfile.lock"
  - "package.json"
  - "README.md"

# Перевод интерфейса темы
site_text:
  ru:
    recent_posts: "Новые публикации:"

# Безопасная настройка фонового баннера для главной страницы
# Безопасная настройка фонового баннера для главной страницы
defaults:
  - scope:
      path: ""
    values:
      header:
        overlay_image: "/assets/images/main-banner.jpg"
        overlay_filter: 0.4

# Безопасное добавление фонового изображения на весь сайт через стили
head_html: |
  <style>
    /* Подкладываем фоновое фото на весь сайт */
    body, .page, .archive, #main {
      background-image: url('/assets/images/site-bg.jpg') !important;
      background-position: center top !important;
      background-repeat: repeat !important;
      background-attachment: fixed !important;
      background-size: auto !important;
      background-color: #f4f7f5 !important;
    }
    
    /* Делаем боковую панель автора белой, чтобы ссылки отлично читались на фоне фото */
    .sidebar {
      background-color: #ffffff !important;
      padding: 15px !important;
      border-radius: 6px !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08) !important;
    }

    /* Делаем подложку статей белой и непрозрачной, чтобы текст не сливался с фоновым фото */
    .page__inner-wrap {
      background-color: #ffffff !important;
      padding: 30px !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important;
    }
  </style>
