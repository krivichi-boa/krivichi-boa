<script>
  function syncMenuLoginButton() {
    const activeUser = localStorage.getItem("boa_user");
    // Находим вкладку Аккаунт в верхнем меню
    const accountMenuLinks = document.querySelectorAll('a[href*="/account/"]');

    if (activeUser && accountMenuLinks.length > 0) {
      const parsed = JSON.parse(activeUser);
      accountMenuLinks.forEach(link => {
        // Подставляем аватарку и имя вошедшего человека прямо в шапку сайта
        link.innerHTML = `<img src="${parsed.avatar}" style="width:20px; height:20px; border-radius:50%; margin-right:5px; vertical-align:middle; object-fit:cover;"> ${parsed.name}`;
      });
    }
  }
  document.addEventListener("DOMContentLoaded", syncMenuLoginButton);
</script>

<!-- СВЕРХНАДЕЖНАЯ АВТОМАТИЧЕСКАЯ СИСТЕМА СКРЫТИЯ СТАТЕЙ БОА -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Проверяем, включен ли параметр private в шапке Jekyll
    {% if page.private == true %}
      
      // Если пользователь АВТОРИЗОВАН — ничего не делаем, даем читать
      if (localStorage.getItem("boa_user")) {
        return; 
      }

      // Если пользователь НЕ авторизован — запускаем жесткое скрытие контента
      // Ищем все возможные контейнеры текста, которые использует тема Minimal Mistakes
      const contentSelectors = [
        '.page__content', 
        '.e-content', 
        'section[itemprop="articleBody"]', 
        '.archive__item-excerpt',
        '#main'
      ];
      
      let mainContentBox = null;
      
      // Ищем первый подошедший селектор темы
      for (let selector of contentSelectors) {
        let box = document.querySelector(selector);
        if (box && selector === '#main') {
          // Если ищем в главном контейнере, то берем внутреннюю wrap-часть
          mainContentBox = box.querySelector('.page__inner-wrap') || box;
          break;
        } else if (box) {
          mainContentBox = box;
          break;
        }
      }

      if (mainContentBox) {
        // Полностью очищаем текст статьи и заменяем его на красную карточку с замком
        mainContentBox.innerHTML = `
          <div id="lock-warning-block" style="background-color: #fff5f5 !important; border-left: 5px solid #ff3d00 !important; padding: 20px !important; border-radius: 6px !important; margin: 20px 0 !important; display: block !important; clear: both !important;">
            <h3 style="color: #ff3d00; margin-top: 0;"><i class="fas fa-lock"></i> Доступ ограничен</h3>
            <p style="margin-bottom: 0; color: #333; font-size: 15px;">Эта публикация содержит закрытые материалы Белорусского общества аквариумистов. Пожалуйста, перейдите во вкладку <b><a href="/account/" style="color: #00bcd4; font-weight: bold; text-decoration: underline;">Аккаунт</a></b> и авторизуйтесь под своим клубным паролем, чтобы прочесть статью.</p>
          </div>
        `;
      }
    {% endif %}
  });
</script>
